name: scramjet-webrtc

services:
  coturn:
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    entrypoint: ["/bin/sh", "/opt/coturn/entrypoint.sh"]
    environment:
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET in tests/webrtc/.env}
      TURN_REALM: ${TURN_REALM:-scramjet.webrtc}
      # host-reachable-ip/container-ip. The container binds the relay to the
      # private address and advertises the host address to clients.
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1/172.29.0.10}
      TURN_ALLOWED_PEER_IP: ${TURN_ALLOWED_PEER_IP:-}
      TURN_LISTENING_PORT: ${TURN_LISTENING_PORT:-13478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-15349}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-50160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-50200}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/entrypoint.sh:/opt/coturn/entrypoint.sh:ro
      - ./coturn/certs:/etc/coturn/certs:ro
    ports:
      - "${TURN_LISTENING_PORT:-13478}:${TURN_LISTENING_PORT:-13478}/udp"
      - "${TURN_LISTENING_PORT:-13478}:${TURN_LISTENING_PORT:-13478}/tcp"
      - "${TURN_TLS_PORT:-15349}:${TURN_TLS_PORT:-15349}/tcp"
      - "${TURN_MIN_PORT:-50160}-${TURN_MAX_PORT:-50200}:${TURN_MIN_PORT:-50160}-${TURN_MAX_PORT:-50200}/udp"
    networks:
      webrtc:
        ipv4_address: 172.29.0.10
    restart: "no"

  credentials:
    image: node:22-alpine
    command: ["node", "/app/credential-server.mjs"]
    environment:
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET in tests/webrtc/.env}
      TURN_URLS: ${TURN_URLS:-turn:127.0.0.1:13478?transport=udp,turn:127.0.0.1:13478?transport=tcp,turns:127.0.0.1:15349?transport=tcp}
      TURN_TTL: ${TURN_TTL:-3600}
      PORT: "18081"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      ALLOW_ANONYMOUS_TEST_ONLY: ${ALLOW_ANONYMOUS_TEST_ONLY:-0}
      CREDENTIAL_SESSION_SECRET: ${CREDENTIAL_SESSION_SECRET:-}
      CREDENTIAL_RATE_LIMIT: ${CREDENTIAL_RATE_LIMIT:-30}
    volumes:
      - ./server:/app:ro
    ports:
      - "18081:18081"
    networks:
      webrtc:
        ipv4_address: 172.29.0.11
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: "no"

networks:
  webrtc:
    ipam:
      config:
        - subnet: 172.29.0.0/24
