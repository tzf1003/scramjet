# Coturn configuration for Scramjet WebRTC tests / reference deployment.
# Secrets and certificates are supplied at runtime, never committed.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
realm=scramjet.webrtc
server-name=scramjet-turn
no-cli
no-multicast-peers
no-software-attribute

# Relay range must match the published Docker range / firewall allowlist.
min-port=49160
max-port=49200

# Allocation and abuse limits.
stale-nonce=600
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300
total-quota=100
user-quota=12
max-bps=1000000
bps-capacity=0

# TLS material is mounted at runtime by tests/webrtc/coturn/generate-certs.sh.
cert=/etc/coturn/certs/turn.crt
pkey=/etc/coturn/certs/turn.key

# Never relay to loopback, private, link-local, multicast, or cloud metadata.
# Tests that need a local peer must pass TURN_ALLOWED_PEER_IP explicitly.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
