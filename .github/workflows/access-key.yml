name: Access gateway
on:
  push:
    paths:
      [
        "deployment/**",
        "tests/deployment/**",
        ".github/workflows/access-key.yml",
      ]
  pull_request:
    paths:
      [
        "deployment/**",
        "tests/deployment/**",
        ".github/workflows/access-key.yml",
      ]
jobs:
  access-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deployment/package-lock.json
      - run: npm ci --prefix deployment --ignore-scripts
      - run: node --test tests/deployment/access-key.test.mjs
