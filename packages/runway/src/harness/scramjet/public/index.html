<!doctype html>
<html>
	<head>
		<title>Scramjet Test Harness</title>
		<script src="/scramjet/scramjet.js"></script>
		<script src="/controller/controller.api.js"></script>
		<script src="/libcurl/index.js"></script>
		<script src="/runway-cleartext-https-transport.js"></script>
	</head>
	<body>
		<h1>Scramjet Test Harness</h1>
		<div id="status">Initializing...</div>
		<button id="reload-btn" style="display: none; margin: 8px 0">
			🔄 Reload Test
		</button>
		<iframe
			id="testframe"
			allow="camera; microphone; display-capture"
			style="width: 100%; height: 80vh; border: 1px solid #ccc"
		></iframe>

		<script>
			const statusEl = document.getElementById("status");
			const testframe = document.getElementById("testframe");
			const reloadBtn = document.getElementById("reload-btn");
			const { Controller } = $scramjetController;
			const LibcurlClient = window.LibcurlTransport.LibcurlClient;

			let controller;
			let scramjetFrame;

			async function init() {
				statusEl.textContent = "Registering service worker...";

				const registration = await navigator.serviceWorker.register("/sw.js");

				// ready also covers a worker that became active between
				// register() and adding a statechange listener (Firefox tabs).
				statusEl.textContent = "Waiting for service worker to activate...";
				await navigator.serviceWorker.ready;
				if (!navigator.serviceWorker.controller) {
					await new Promise((resolve) => {
						const finish = () => {
							clearTimeout(timer);
							navigator.serviceWorker.removeEventListener(
								"controllerchange",
								finish
							);
							resolve();
						};
						const timer = setTimeout(finish, 5000);
						navigator.serviceWorker.addEventListener(
							"controllerchange",
							finish
						);
						if (navigator.serviceWorker.controller) finish();
					});
				}
				if (!navigator.serviceWorker.controller) {
					// An already-active worker need not emit another controllerchange
					// for a newly opened tab. Reload once so the document is controlled.
					const key = "__runway_sw_claim_reload";
					if (!sessionStorage.getItem(key)) {
						sessionStorage.setItem(key, "1");
						location.reload();
						return;
					}
					throw new Error(
						"Active service worker did not control the harness after reload"
					);
				}
				sessionStorage.removeItem("__runway_sw_claim_reload");

				statusEl.textContent = "Initializing controller...";

				const innerTransport = new LibcurlClient({
					wisp: `ws://${location.hostname}:4501/`,
				});
				const transport = new RunwayCleartextHttpsTransport(innerTransport);

				const sw = navigator.serviceWorker.controller ?? registration.active;
				if (!sw) {
					throw new Error("No service worker available for controller");
				}

				controller = new Controller({
					serviceworker: sw,
					transport,
				});
				window.__runwayController = controller;
				window.__runwaySetWebrtcConfig = (config) => {
					controller.scramjetConfig.webrtc = {
						...controller.scramjetConfig.webrtc,
						...config,
					};
				};
				window.__runwayRefreshWebrtcCredentials = () =>
					controller.refreshWebrtcCredentials();
				window.__runwayReconnectTransport = async () => {
					const next = new RunwayCleartextHttpsTransport(
						new LibcurlClient({ wisp: `ws://${location.hostname}:4501/` })
					);
					await next.init();
					controller.setTransport(next);
				};

				await controller.ready;

				scramjetFrame = controller.createFrame(testframe);
				window.__runwayScramjetFrame = scramjetFrame;

				statusEl.textContent = "Ready - waiting for test...";

				window.__runwayNavigate = (url) => {
					statusEl.textContent = `Loading test: ${url}`;
					// Store the URL for reload support
					sessionStorage.setItem("__runway_last_test", url);
					reloadBtn.style.display = "inline-block";
					// injectTestFunctions();
					console.log("navigating to", url);
					scramjetFrame.go(url);
				};

				window.__runwayGetProxiedUrl = (url) => {
					return $scramjet.rewriteUrl(url, scramjetFrame.context, {
						origin: new URL(location.href),
						base: new URL(location.href),
					});
				};

				window.__runwayReload = () => {
					const lastTest = sessionStorage.getItem("__runway_last_test");
					if (lastTest) {
						window.__runwayNavigate(lastTest);
					}
				};

				reloadBtn.addEventListener("click", window.__runwayReload);

				// Automated popup tests install their fixture mapping and policy
				// before navigating. Normal harness reloads restore the last test.
				const lastTest = sessionStorage.getItem("__runway_last_test");
				const manualNavigation =
					new URL(location.href).searchParams.get("runwayManualNavigation") ===
					"1";
				if (lastTest && !manualNavigation) {
					console.log("Reloading last test:", lastTest);
					window.__runwayNavigate(lastTest);
				}

				console.log("Harness ready, __runwayNavigate exposed");
			}

			init().catch((err) => {
				statusEl.textContent = `Error: ${err.message}`;
				console.error("Harness init error:", err);
			});
		</script>
	</body>
</html>
